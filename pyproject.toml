[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-campaign-contracts"
version = "0.1.0a1"
description = "Experimental backend-neutral contracts for inference campaigns"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE.md"}
authors = [{name = "Richard O'Shaughnessy"}]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
]

[project.urls]
Repository = "https://github.com/oshaughnessy-junior/inference-campaign-contracts"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inference_campaign_contracts = ["schemas/*.json"]
